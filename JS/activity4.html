<!DOCTYPE html>
<html>
    <head>
        <title>Operators in JS</title>
    </head>
    <body>
     <h1>Operators in Javascript</h1>
     <h2 id="id1"></h2>
     <h2 id=id2></h2>
     <h2 id="id3"></h2>
     <h2 id="id4"></h2>
     <script>
        b=123
        c=456
        document.getElementById("id1").innerHTML=b+c
        document.getElementById("id2").innerHTML=c-b
    document.getElementById("id3").innerHTML=b%c
document.getElementById("id4").innerHTML=c/b
     </script>
    </body>
</html>
