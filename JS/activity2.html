<!DOCTYPE html>
<html>
    <head>
        <title>Variables in Javascript</title>
    </head>
    <body>
        <h1>Javascript variables</h1>
        <p id="result"></p>
        <script>
            x=10
            y=20
            z=x+y
            document.getElementById("result").innerHTML=z
        </script>
    </body>
</html>
