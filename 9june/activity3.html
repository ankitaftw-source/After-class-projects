<!DOCTYPE html>
<html>
    <head>
        <title>Progress bar in bootstrap</title>
        <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
</script>
    </head>
    <body>
        <div class="container">
            <h2>Basic Progress bar</h2>
            <p>To creat a default progress bar, add a .progress 
                class to a container element and add the progress-bar child
                to its child element
            </p>
            <div class="progress">
                <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width: 70%;">70%</div>
            </div>
        </div>
    </body>
</html>
