<!DOCTYPE html>
<html>
    <head>
        <title>Loops in JS</title>
    </head>
    <body>
      <h2>Loops in JS</h2>
      <p id="demo"></p>
      <script>
        var text=""
        var i
        for(i=0; i<99; i++){
            text +="the number is"+i+"<br>"
        }
        document.getElementById("demo").innerHTML=text
      </script>
    </body>
</html>
