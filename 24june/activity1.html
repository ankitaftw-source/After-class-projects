<!DOCTYPE html>
<html>
    <head>
        <title>Methods in Java Script</title>
    </head>
    <body>
       <h2>Methods in JS</h2>
       <script>
        var text="aArYa MiTtAl"
        document.write(text.toUpperCase())
        document.write("<br>")
        document.write(text.toLowerCase())
        document.write("<br>")
        document.write(text.startsWith("A"))
       </script> 
    </body>
</html>
