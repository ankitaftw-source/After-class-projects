<!DOCTYPE html>
<html>
    <head>
        <title>Functions in JS</title>
    </head>
    <body>
       <button onclick="add(4)">Click</button> 
       <script>
        function add(x,y){
            if(y==undefined){
                y=2
            }
            document.write(x+y)
        }
       </script>
    </body>
</html>
