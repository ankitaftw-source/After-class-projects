!DOCTYPE html>
<html>
<head>
<title>Scrollspy in Bootstrap</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-bs-spy="scroll" data-bs-target="#navbar-example" data-bs-smooth-scroll="true" tabindex="0">
<nav id="navbar-example" class="navbar navbar-light bg-light px-3 sticky-top">
<a class="navbar-brand" href="#">Navbar</a>
<ul class="nav nav-pills">
<li class="nav-item">
<a class="nav-link" href="#section1">Section 1</a>
</li>
<li class="nav-item">
<a class="nav-link" href="#section2">Section 2</a>
</li>
<li class="nav-item">
<a class="nav-link" href="#section3">Section 3</a>
</li>
</ul>
</nav>
<div class="container mt-3">
    <div id="section1" style="height:500px">
    <h2>Section 1</h2>
    <p>Content for section 1...</p>
    </div>

    <div id="section2" style="height: 500px;">
        <h2>Section 2</h2>
        <p>Content for section 2...</p>
    </div>

    <div id="section3" style="height: 500px;">
        <h2>Section 3</h2>
        <p>Content for section 3...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
