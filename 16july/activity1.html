<!DOCTYPE html>

<html>

<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Bootstrap Carousel Example</title>

</head>

<body>

<div class="container mt-4">

<h2>Bootstrap Carousel Example</h2>

<div id="myCarousel" class="carousel slide" data-bs-ride="carousel">


<div class="carousel-inner">

<div class="carousel-item active">

<img src="https://shop.teamsg.in/cdn/shop/files/22-07-202401188.png?v=1744374583" class="d-block w-100" alt="Slide 1">

</div>

<div class="carousel-item">

<img src="https://m.media-amazon.com/images/I/71sjsxaF1nL._AC_UY1000_.jpg" class="d-block w-100" alt="Slide 2">

</div>

<div class="carousel-item">

<img src="https://www.campusshoes.com/cdn/shop/files/VESPER_VESPER_ICE.BLU-NAVY_07.webp?v=1758174881" class="d-block w-100" alt="Slide 3">

</div>

<div>
    <button class="carousel-control-perv" type="button" data-bs-target="#mycarousel" data-bs-slide="perv">
<span class="carousel-control-perv-icon"></span>

</button>
<div>
    <button class="carousel-control-perv" type="button" data-bs-target="#mycarousel">
    <span class="carousel-control-next-icon"></span>
</button>
    
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
