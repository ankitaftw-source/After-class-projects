<!DOCTYPE html>
<html>
    <head>
        <title>CSS in HTML</title>
        <style>
            h2{
                color: green;
            }
        </style>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 style="color: blue;">Cascading Style Sheet</h1>
        <h2>Internal CSS</h2>
        <h3>External CSS</h3>
        <h4 id="id1">ID selector</h4>
        <p id="id1">ID selector</p>
        <h5 class="class1">Class Selector</h5>
        <p class="class1">Class Selector</p>
        <h6>Group Selector</h6>
        <p>Group Selector</p>
    </body>
</html>
