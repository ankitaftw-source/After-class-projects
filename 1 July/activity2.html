<!DOCTYPE html>
<html>
    <head>
        <title>JS array methods</title>
    </head>
    <body>
        <h1>JS Array Methods</h1>
        <p id="id1"></p>
         <p id="id2"></p>
          <p id="id3"></p>
          <script>
            var fruits=["Apple","Banana","Pineapple","Tomato","Grapes"]
            document.getElementById("id1").innerHTML=fruits
            document.getElementById("id2").innerHTML=fruits.join(" * ")
            fruits.pop()
             document.getElementById("id3").innerHTML=fruits
          </script>
    </body>
</html>
