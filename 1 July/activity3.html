<!DOCTYPE html>
<html>
    <head>
        <title>Call Stack</title>
    </head>
    <body>
        <h1>Call Stack</h1>
        <p id="result"></p>
        <script>
            function sum(a,b){
                return a+b
            }
            function average(a,b){
                return sum(a,b)/2
            }
            let result= average(10,20)
            document.getElementById("result").innerHTML=result
        </script>
    </body>
</html>
